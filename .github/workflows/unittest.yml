# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
name: Unittest

on:
  push:
    paths:
      - "**.py"
      - "**.yml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["pypy3.11", "3.11", "3.12", "3.13", "3.14", "3.15"]
    name: Test against ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          require-checksums: true
      - name: Install dependencies
        run: |
          uv sync --locked --python "$(command -v python)" --group test --no-install-project --no-build
      - name: Run unittests
        # run: |
        #   python $(git ls-files 'tests/*.py')
        run: |
          uv run --no-sync python -m unittest discover tests
