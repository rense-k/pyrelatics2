name: Pylint

on:
  push:
    paths:
      - "**.py"
      - "**.yml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          require-checksums: true
      - name: Install dependencies
        run: |
          uv sync --locked --python "$(command -v python)" --group lint --no-install-project --no-build
      - name: Analyzing the code with pylint
        run: |
          uv run --no-sync python -m pylint $(git ls-files '*.py')
